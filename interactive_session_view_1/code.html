<meta charset="utf-8"/>

<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .custom-radio:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='%23ffffff' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex flex-col min-h-screen">
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark shadow-sm">
<div class="flex items-center justify-between p-4">
<button class="text-slate-800 dark:text-white">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
</button>
<h1 class="text-lg font-bold text-slate-800 dark:text-white flex-1 text-center">Event Name</h1>
<div class="w-6"></div>
</div>
<div class="border-b border-slate-200 dark:border-slate-700">
<nav class="flex px-4 -mb-px">
<a class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-primary text-primary" href="#">Polls</a>
<a class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-primary hover:border-primary/50 dark:hover:text-primary" href="#">Q&amp;A</a>
<a class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-primary hover:border-primary/50 dark:hover:text-primary" href="#">Discussion</a>
<a class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-primary hover:border-primary/50 dark:hover:text-primary" href="#">Live</a>
</nav>
</div>
</header>
<main class="flex-1 overflow-y-auto p-4 space-y-6">
<section>
<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-bold text-slate-800 dark:text-white">Live Poll</h2>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">1 of 2</span>
</div>
<p class="text-slate-600 dark:text-slate-300 mb-4">What is your favorite aspect of this event?</p>
<div class="space-y-3">
<label class="flex items-center gap-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<input class="custom-radio h-5 w-5 appearance-none rounded-full border-2 border-slate-300 dark:border-slate-600 checked:bg-primary checked:border-primary focus:outline-none" name="poll-option" type="radio"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Networking opportunities</span>
</label>
<label class="flex items-center gap-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<input class="custom-radio h-5 w-5 appearance-none rounded-full border-2 border-slate-300 dark:border-slate-600 checked:bg-primary checked:border-primary focus:outline-none" name="poll-option" type="radio"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Keynote speakers</span>
</label>
<label class="flex items-center gap-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<input class="custom-radio h-5 w-5 appearance-none rounded-full border-2 border-slate-300 dark:border-slate-600 checked:bg-primary checked:border-primary focus:outline-none" name="poll-option" type="radio"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Interactive workshops</span>
</label>
<label class="flex items-center gap-4 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<input class="custom-radio h-5 w-5 appearance-none rounded-full border-2 border-slate-300 dark:border-slate-600 checked:bg-primary checked:border-primary focus:outline-none" name="poll-option" type="radio"/>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Exhibitor showcases</span>
</label>
</div>
<div class="mt-6 flex justify-end">
<button class="flex items-center justify-center rounded-lg bg-primary px-6 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-primary/90">
                        Submit Vote
                    </button>
</div>
</section>
<div class="border-t border-slate-200 dark:border-slate-700"></div>
<section>
<h2 class="text-xl font-bold text-slate-800 dark:text-white mb-4">Poll Results</h2>
<div class="space-y-5">
<div class="space-y-2">
<div class="flex justify-between text-sm font-medium text-slate-700 dark:text-slate-200">
<span>Networking opportunities</span>
<span class="text-slate-500 dark:text-slate-400">45%</span>
</div>
<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-2 rounded-full bg-primary" style="width: 45%;"></div>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between text-sm font-medium text-slate-700 dark:text-slate-200">
<span>Keynote speakers</span>
<span class="text-slate-500 dark:text-slate-400">25%</span>
</div>
<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-2 rounded-full bg-primary" style="width: 25%;"></div>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between text-sm font-medium text-slate-700 dark:text-slate-200">
<span>Interactive workshops</span>
<span class="text-slate-500 dark:text-slate-400">15%</span>
</div>
<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-2 rounded-full bg-primary" style="width: 15%;"></div>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between text-sm font-medium text-slate-700 dark:text-slate-200">
<span>Exhibitor showcases</span>
<span class="text-slate-500 dark:text-slate-400">15%</span>
</div>
<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-2 rounded-full bg-primary" style="width: 15%;"></div>
</div>
</div>
</div>
</section>

</a>
<a class="flex flex-col items-center gap-1 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:text-primary" href="#">
